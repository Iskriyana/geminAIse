<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>geminAIse - Virtual Try On</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; max-width: 800px; margin: 0 auto; background: #fafafa; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        #camera-preview { width: 100%; max-width: 400px; border-radius: 8px; display: none; margin: 0 auto; }
        #captured-image { width: 100%; max-width: 400px; border-radius: 8px; display: none; margin: 0 auto; }
        .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        button { padding: 10px 20px; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; font-size: 16px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button#mic-btn.active { background: #dc3545; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 20px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user-message { background: #007bff; color: white; margin-left: auto; }
        .agent-message { background: #e9ecef; color: #333; }
        .system-message { background: #fff3cd; color: #856404; text-align: center; font-size: 12px; width: 100%; max-width: 100%; }
        .image-container img { max-width: 100%; border-radius: 8px; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>geminAIse 👗</h1>
        
        <div id="messages"></div>

        <div style="text-align: center;">
            <video id="camera-preview" autoplay playsinline></video>
            <img id="captured-image" />
        </div>

        <div class="controls">
            <button id="mic-btn">Start Microphone</button>
            <button id="camera-btn">Open Camera</button>
            <button id="capture-btn" style="display:none;">Capture Photo</button>
            <button id="upload-btn">Upload Photo</button>
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
        </div>
        
        <p style="text-align: center; color: #666; font-size: 14px;">Select the `geminAIse` agent, turn on your microphone, and ask to try on an item!</p>
    </div>

    <!-- The Web Audio API Context and WebSocket Logic -->
    <script src="/static/js/app.js?v=6" type="module"></script>
</body>
</html>
