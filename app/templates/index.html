<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>geminAIse - Virtual Try On</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #fafafa; }
        .main-wrapper { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; align-items: stretch; }
        .column { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; display: flex; flex-direction: column; }
        h1 { color: #333; text-align: center; margin-top: 0; }
        #camera-preview { width: 100%; border-radius: 8px; display: none; margin: 0 auto; }
        #captured-image { width: 100%; border-radius: 8px; display: none; margin: 0 auto; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        button { padding: 10px 20px; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; font-size: 16px; flex: 1; min-width: 140px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button#mic-btn.active { background: #dc3545; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #messages { flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 20px; min-height: 400px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user-message { background: #007bff; color: white; margin-left: auto; }
        .agent-message { background: #e9ecef; color: #333; }
        .system-message { background: #fff3cd; color: #856404; text-align: center; font-size: 12px; width: 100%; max-width: 100%; }
        .image-container img { max-width: 100%; border-radius: 8px; }
        .agent-image { max-width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .instruction-text { text-align: center; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Left Column: Input (Camera & Upload) -->
        <div class="column left-col">
            <h1>geminAIse 👗</h1>
            <p class="instruction-text">Tap "Open Camera" or "Upload Photo" to provide an image of yourself.</p>
            
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; background: #f8f9fa; border-radius: 8px; margin-bottom: 20px; overflow: hidden; border: 2px dashed #ddd;">
                <video id="camera-preview" autoplay playsinline></video>
                <img id="captured-image" />
                <div id="placeholder-text" style="color: #aaa;">Your photo will appear here</div>
            </div>

            <div class="controls">
                <button id="camera-btn">Open Camera</button>
                <button id="capture-btn" style="display:none;">Capture Photo</button>
                <button id="upload-btn">Upload Photo</button>
                <button id="mic-btn" style="flex-basis: 100%;">Start Microphone</button>
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
            </div>
            <p class="instruction-text" style="margin-bottom: 0;">Once you upload a photo, turn on your microphone and ask the agent to try something on!</p>
        </div>

        <!-- Right Column: Output (Chat & Generation) -->
        <div class="column right-col">
            <h2 style="margin-top: 0; text-align: center; color: #333; font-size: 1.25em;">Virtual Fitting Room</h2>
            <div id="messages"></div>
        </div>
    </div>

    <!-- The Web Audio API Context and WebSocket Logic -->
    <script src="/static/js/app.js?v=6" type="module"></script>
</body>
</html>
